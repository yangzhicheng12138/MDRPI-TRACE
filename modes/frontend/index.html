<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f8faf9">
  <title>MDRPI · 智能工作台</title>
  <link rel="icon" type="image/svg+xml" sizes="any" href="/ui/assets/brand-care-t.svg">
  <script src="/ui/assets/theme.js"></script>
  <link rel="stylesheet" href="/ui/assets/styles.css?v=20261116-teaching-help">
  <script defer src="/ui/assets/vendor/marked.min.js"></script>
  <script defer src="/ui/assets/vendor/purify.min.js"></script>
  <script defer src="/ui/assets/vendor/highlight.min.js"></script>
  <script type="module" src="/ui/assets/app.js?v=20261116-teaching-help"></script>
</head>
<body>
  <a class="skip-link" href="#composer-input">跳到输入框</a>
  <div class="app" id="app">
    <div class="sidebar-scrim" id="sidebar-scrim"></div>
    <aside class="sidebar" id="sidebar" aria-label="会话导航">
      <div class="brand"><img class="brand-logo" src="/ui/assets/brand-care-t.svg" alt="" width="40" height="40"><div><b>MDRPI</b><span>智能工作台</span></div><button class="icon-button sidebar-close" data-command="sidebar" aria-label="收起侧栏" data-icon="panel"></button></div>
      <button class="new-chat" id="new-chat" data-command="new"><span data-icon="plus"></span><span>新建对话</span><kbd>⇧ ⌘ O</kbd></button>
      <nav class="mode-nav" aria-label="工作模式">
        <button data-mode="chat" class="mode-button active"><span data-icon="chat"></span><span>普通问答</span></button>
        <button data-mode="teaching" class="mode-button"><span data-icon="book"></span><span>教学练习</span></button>
      </nav>
      <div class="history-head"><span id="history-label">最近对话</span><button class="icon-button" data-command="archive-list" aria-label="查看已归档会话" title="查看已归档会话" data-icon="archive"></button></div>
      <label class="search-box"><span data-icon="search"></span><input id="history-search" placeholder="搜索对话" aria-label="搜索对话"><kbd>/</kbd></label>
      <div id="history-list" class="history-list" aria-live="polite"></div>
      <div class="sidebar-foot"><a class="side-tool" href="/question-studio/" aria-label="出题工作台" style="text-decoration:none"><span data-icon="spark" aria-hidden="true"></span><span>出题工作台</span></a><button class="side-tool" data-command="settings"><span data-icon="settings"></span><span>偏好与设置</span></button><div class="connection"><i id="connection-dot"></i><span id="connection-label">正在连接</span><button class="icon-button" data-command="help" aria-label="使用说明" data-icon="help"></button></div></div>
    </aside>
    <main class="main">
      <header class="topbar">
        <button class="icon-button" data-command="sidebar" aria-label="切换侧栏" aria-controls="sidebar" aria-expanded="true" data-icon="panel"></button>
        <div class="heading"><div class="heading-top"><span id="header-title">新对话</span><span class="mode-pill" id="mode-pill">普通问答</span></div><span id="header-subtitle">从一个问题开始</span></div>
        <div class="header-tools"><button class="icon-button" data-command="theme" aria-label="切换明暗主题" data-icon="sun"></button><button class="icon-button" data-command="conversation-menu" aria-label="对话选项" aria-haspopup="menu" data-icon="more"></button></div>
      </header>
      <div class="service-notice" id="service-notice" hidden><span id="service-notice-text" role="status" aria-live="polite"></span><button type="button" data-command="check-service">重新检查</button></div>
      <div class="stage-strip" id="stage-strip" hidden></div>
      <div class="branch-context" id="branch-context" hidden></div>
      <nav class="answer-outline" id="answer-outline" aria-label="六步回答导航" hidden></nav>
      <div class="teaching-layout" id="teaching-layout">
        <section class="scroll-area" id="scroll-area" aria-label="对话内容" tabindex="0">
          <div class="welcome" id="welcome"></div>
          <section id="teaching-focus" class="teaching-focus" aria-label="当前教学任务" hidden></section>
          <div class="messages" id="messages" role="log" aria-label="消息记录"></div>
          <div class="turn-status" id="turn-status" hidden aria-live="polite"></div>
          <div class="stream-message" id="stream-message" hidden></div>
          <div class="turn-error" id="turn-error" role="status" aria-live="polite" hidden></div>
          <div class="generated-files" id="generated-files" hidden></div>
          <section id="answer-tools" class="answer-tools" aria-label="题型作答工具" hidden></section>
          <div class="action-area" id="action-area" hidden></div>
          <div class="reading-end" id="reading-end"></div>
        </section>
        <aside class="teaching-support teaching-explanations" id="teaching-explanations" role="region" aria-label="学习讲解" hidden>
          <details class="teaching-support-panel teaching-panel-section" open>
            <summary><span class="teaching-panel-icon" data-icon="book"></span><strong>教学讲解</strong><span class="teaching-panel-count" id="teaching-explanations-count" aria-live="polite">0</span><span class="teaching-panel-chevron" data-icon="chevron"></span></summary>
            <div class="teaching-panel-body panel-content" id="teaching-explanations-body"><p class="teaching-panel-empty">有不明白的地方，可以继续问。</p></div>
          </details>
        </aside>
        <aside class="teaching-support teaching-hints" id="teaching-hints" role="region" aria-label="练习提示" hidden>
          <details class="teaching-support-panel teaching-panel-section" open>
            <summary><span class="teaching-panel-icon" data-icon="spark"></span><strong>练习提示</strong><span class="teaching-panel-count" id="teaching-hints-count" aria-live="polite">0</span><span class="teaching-panel-chevron" data-icon="chevron"></span></summary>
            <div class="teaching-panel-body panel-content" id="teaching-hints-body"><p class="teaching-panel-empty">需要帮助时，先看一条提示。</p></div>
          </details>
        </aside>
      </div>
      <div class="composer-zone">
        <button class="jump-latest" id="jump-latest" data-command="latest" hidden><span data-icon="arrow-down"></span>回到最新</button>
        <div class="composer-wrap">
          <div class="chat-shortcuts" id="chat-shortcuts" aria-label="MDRPI专业快捷任务" hidden></div>
          <div class="revision-chip" id="revision-chip" hidden></div>
          <div class="attachment-list" id="attachment-list" hidden></div>
          <form class="composer" id="composer">
            <label class="sr-only" for="composer-input">输入消息</label>
            <textarea id="composer-input" rows="1" placeholder="有问题，尽管问…" autocomplete="off" aria-describedby="composer-limit-note"></textarea>
            <small id="composer-limit-note" class="composer-limit-note" role="status" aria-live="polite" hidden></small>
            <div class="composer-bottom"><div class="composer-tools"><button type="button" class="icon-button" data-command="attach" aria-label="添加文件" title="添加文件" data-icon="plus"></button><span class="draft-note" id="draft-note"></span></div><button type="submit" class="send-button" id="send-button" aria-label="发送消息" disabled data-icon="arrow-up"></button></div>
          </form>
          <div class="composer-caption"><span id="composer-caption">Enter 发送 · Shift + Enter 换行</span><span class="caption-note">重要内容请结合实际核对</span></div>
        </div>
      </div>
    </main>
    <aside id="artifact-panel" class="artifact-panel" aria-label="文件预览与修改" hidden>
      <header class="artifact-panel-header"><div><span class="eyebrow">生成成果</span><h2 id="artifact-preview-title">文件预览</h2></div><button id="artifact-close" class="icon-button" data-command="close-artifact" aria-label="关闭文件预览" data-icon="x"></button></header>
      <div class="artifact-toolbar"><div id="artifact-preview-version"></div><a id="artifact-preview-download" class="button" download><span data-icon="download"></span>下载原文件</a></div>
      <p class="artifact-preview-note" id="artifact-preview-note"></p>
      <div class="artifact-preview-body" id="artifact-preview-body"></div>
      <form class="artifact-revision-form" id="artifact-revision-form"><label for="artifact-revision-input">继续修改</label><textarea id="artifact-revision-input" rows="2" maxlength="4000" placeholder="例如：把标题改为…，保留其他内容"></textarea><p id="artifact-revision-error" class="inline-error" role="status"></p><button type="submit" class="button primary">生成新版本<span data-icon="arrow"></span></button></form>
    </aside>
  </div>
  <input type="file" id="file-picker" multiple hidden accept=".pdf,.docx,.pptx,.txt,.md,.csv,.xlsx,.png,.jpg,.jpeg,.webp">
  <div class="drop-overlay" id="drop-overlay" hidden><span data-icon="upload"></span><h2>把文件放在这里</h2><p>添加到当前会话，与问题一起发送</p></div>
  <div class="popover" id="popover" hidden></div>
  <dialog id="dialog" class="dialog" aria-labelledby="dialog-title" closedby="any"><div class="dialog-header"><div><span class="eyebrow" id="dialog-eyebrow">MDRPI</span><h2 id="dialog-title"></h2></div><button class="icon-button" data-command="close-dialog" aria-label="关闭面板" autofocus data-icon="x"></button></div><div class="dialog-body" id="dialog-body"></div></dialog>
  <div class="toasts" id="toasts" role="status" aria-live="polite"></div>
  <noscript>请启用JavaScript以使用聊天工作台。也可使用会话API。</noscript>
</body>
</html>
